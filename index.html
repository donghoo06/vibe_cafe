<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 - 주문서</title>
  <!-- CSS 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- [페이지 상단] 카페 헤더 -->
  <header>
    <div class="logo">☕</div>
    <h1>바이브 카페</h1>
    <p>당신의 하루에 바이브를 더하다</p>
  </header>

  <!-- [탭 메뉴] 주문하기 / 주문 내역 -->
  <nav class="tab-menu" aria-label="메뉴 탭">
    <button type="button" class="tab-btn active" id="tabBtnOrder">☕ 주문하기</button>
    <button type="button" class="tab-btn" id="tabBtnHistory">
      📋 주문 내역 <span id="orderBadge" class="badge">0</span>
    </button>
  </nav>

  <!-- [1. 주문하기 탭 컨텐츠] -->
  <div id="tabContentOrder">
    <!-- [주문서 폼] novalidate: 브라우저 기본 유효성 검사 비활성화 (JS 검증용) -->
    <form id="orderForm" novalidate>


    <!-- 1. 이름 입력 (필수) -->
    <div>
      <label for="userName">이름</label>
      <input type="text" id="userName" name="userName" required>
    </div>

    <!-- 2. 전화번호 입력 -->
    <div>
      <label for="userPhone">전화번호</label>
      <input type="tel" id="userPhone" name="userPhone">
    </div>

    <!-- 3. 음료 선택 (드롭다운) -->
    <div>
      <label for="beverage">음료 선택</label>
      <select id="beverage" name="beverage">
        <option value="" data-price="0">-- 음료를 선택하세요 --</option>
        <option value="americano" data-price="3500">아메리카노 (3,500원)</option>
        <option value="latte" data-price="4000">카페라떼 (4,000원)</option>
        <option value="mocha" data-price="4500">카페모카 (4,500원)</option>
        <option value="vanilla-latte" data-price="4500">바닐라라떼 (4,500원)</option>
        <option value="green-tea-latte" data-price="4500">녹차라떼 (4,500원)</option>
        <option value="brown-sugar-bubble-tea" data-price="5000">흑당버블티 (5,000원)</option>
      </select>
    </div>

    <!-- 4. 사이즈 선택 (라디오) -->
    <fieldset>
      <legend>사이즈</legend>
      <div>
        <input type="radio" id="sizeS" name="size" value="S" data-price="0">
        <label for="sizeS">S (+0원)</label>
      </div>
      <div>
        <input type="radio" id="sizeM" name="size" value="M" data-price="500" checked>
        <label for="sizeM">M (+500원)</label>
      </div>
      <div>
        <input type="radio" id="sizeL" name="size" value="L" data-price="1000">
        <label for="sizeL">L (+1,000원)</label>
      </div>
    </fieldset>

    <!-- 5. 추가 옵션 (체크박스) -->
    <fieldset>
      <legend>추가 옵션</legend>
      <div>
        <input type="checkbox" id="optShot" name="extraOption" value="shot" data-price="500">
        <label for="optShot">샷 추가 (+500원)</label>
      </div>
      <div>
        <input type="checkbox" id="optCream" name="extraOption" value="cream" data-price="500">
        <label for="optCream">크림 추가 (+500원)</label>
      </div>
      <div>
        <input type="checkbox" id="optSyrup" name="extraOption" value="syrup" data-price="300">
        <label for="optSyrup">시럽 추가 (+300원)</label>
      </div>
      <div>
        <input type="checkbox" id="optDecaf" name="extraOption" value="decaf" data-price="0">
        <label for="optDecaf">디카페인 (+0원)</label>
      </div>
    </fieldset>

    <!-- 6. 수량 입력 -->
    <div>
      <label for="quantity">수량</label>
      <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
    </div>

    <!-- 7. 요청사항 입력 -->
    <div>
      <label for="requests">요청사항</label>
      <textarea id="requests" name="requests" rows="4"></textarea>
    </div>

    <!-- 8. 예상 금액 표시 영역 -->
    <div id="estimatedPriceArea">
      <span>예상 금액: </span>
      <span id="estimatedPrice">0</span>원
    </div>

    <!-- 9. 주문하기 버튼 & 10. 다시 작성 버튼 -->
    <div>
      <button type="submit" id="submitOrderBtn">주문하기</button>
      <button type="reset" id="resetOrderBtn">다시 작성</button>
    </div>

  </form>

    <!-- 11. 주문 확인 메시지 표시 영역 (처음에는 hidden 클래스로 숨김) -->
    <div id="orderConfirmation" class="hidden"></div>
  </div>

  <!-- [2. 주문 내역 탭 컨텐츠] (초기에는 hidden 클래스로 숨김) -->
  <section id="tabContentHistory" class="hidden" aria-label="주문 내역 목록">
    <!-- 주문 카드 목록이 들어갈 영역 -->
    <div id="orderList"></div>

    <!-- 주문이 없을 때 안내 메시지 -->
    <div id="emptyOrderMessage" class="empty-message">아직 주문 내역이 없어요 ☕</div>

    <!-- 목록 하단 음료별 판매 요약 및 총 주문 금액, 모두 지우기 버튼 영역 -->
    <div id="historySummaryArea" class="history-summary hidden">
      <div class="summary-details">
        <div id="beverageSummaryText" class="beverage-summary-text"></div>
        <div id="historySummaryText">총 주문 금액: 0원 (0건)</div>
      </div>
      <button type="button" id="clearHistoryBtn" class="clear-btn">내역 모두 지우기</button>
    </div>
  </section>

  <!-- Supabase JS v2 CDN 라이브러리 연결 (script.js보다 먼저 로드) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- JavaScript 스크립트 연결 -->
  <script src="script.js"></script>
</body>
</html>
